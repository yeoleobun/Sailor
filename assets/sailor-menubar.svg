<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- Sailor Menu Bar Template Icon (18x18pt monochrome) -->
  <!-- Upright by default; animate pendulum swing around top eye (9, 3.3) or tilt -20° -->
  <g color="#000000">
    <!-- Top Ring (Eye) -->
    <circle cx="9" cy="3.5" r="1.55" fill="none" stroke="currentColor" stroke-width="1.45" />
    <!-- Vertical Shank -->
    <line x1="9" y1="5.1" x2="9" y2="14.7" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" />
    <!-- Rounded Crossbar -->
    <line x1="6.2" y1="7.8" x2="11.8" y2="7.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    <!-- Sweeping Bottom Arc -->
    <path d="M 3.3 10.4 A 5.7 5.7 0 0 0 14.7 10.4" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" />
    <!-- Left Pointed Fluke Tip -->
    <path d="M 3.1 8.8 L 4.7 10.7 L 2.0 11.2 Z" fill="currentColor" stroke="currentColor" stroke-width="0.45" stroke-linejoin="round" />
    <!-- Right Pointed Fluke Tip -->
    <path d="M 14.9 8.8 L 13.3 10.7 L 16.0 11.2 Z" fill="currentColor" stroke="currentColor" stroke-width="0.45" stroke-linejoin="round" />
  </g>
</svg>
