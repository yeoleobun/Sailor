name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Code Signing Certificate
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/sailor-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          P12_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CODESIGN_P12" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CODESIGN_PASSWORD" \
            -A -t cert -f pkcs12 \
            -T /usr/bin/codesign

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"

      - name: Build & Package Release Artifacts
        env:
          SIGN_IDENTITY: yeoleobun
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || 'v0.1.2' }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          ./scripts/release.sh

      - name: Verify Code Signature
        run: |
          codesign -dv --verbose=2 build/Sailor.app

      - name: Cleanup Temporary Keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/sailor-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping upload to preserve SHA-256."
          else
            gh release create "$TAG" \
              dist/Sailor-macos-arm64.zip \
              dist/Sailor-macos-arm64.dmg \
              dist/SHA256SUMS.txt \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Auto-bump yeoleobun/homebrew-tap (when HOMEBREW_TAP_TOKEN secret is set)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping automatic homebrew-tap push."
            exit 0
          fi
          VERSION="${TAG_NAME#v}"
          ZIP_SHA=$(awk '/Sailor-macos-arm64\.zip/ {print $1}' dist/SHA256SUMS.txt)
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yeoleobun/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          sed -i '' -e "s/version \".*\"/version \"${VERSION}\"/" -e "s/sha256 \".*\"/sha256 \"${ZIP_SHA}\"/" Casks/sailor.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sailor.rb
          git diff --cached --quiet || (git commit -m "Bump sailor cask to ${VERSION}" && git push origin main)
